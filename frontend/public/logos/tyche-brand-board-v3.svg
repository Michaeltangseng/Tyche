<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tyche Trace V3 brand board</title>
  <desc id="desc">A brand-system board showing the V3 mark, wordmark, app icon, navigation use, supported Agent field, README application, construction logic, and palette.</desc>

  <defs>
