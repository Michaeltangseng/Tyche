        d="M13 57V33C13 23.4 18.3 17 26.2 17C34.1 17 38.8 23.4 38.8 32.8V56.5C38.8 39.1 44.4 27 52.9 27C61.1 27 65.9 33.5 65.9 42.5V47.5C65.9 53.8 69.1 57 74.7 57"
        stroke="currentColor"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="85.5" cy="57" r="4.8" fill="#EF5A45" />
    </g>
    <g id="trace-wordmark">
      <use href="#trace-mark" />
      <text x="118" y="52" fill="currentColor" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="650" letter-spacing="-0.03em">Tyche</text>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#DDE0E4" />

